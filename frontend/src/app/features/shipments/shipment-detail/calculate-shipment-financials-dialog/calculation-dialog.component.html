<h2 mat-dialog-title class="fw-bold">New Calculation</h2>

<mat-dialog-content class="pt-1 dialog-form">
  <form [formGroup]="calcForm" class="d-flex flex-column gap-2">
    <mat-form-field appearance="outline">
      <mat-label>Income</mat-label>
      <input
        matInput
        type="number"
        formControlName="income"
        placeholder="0.00"
      />
      <span matTextPrefix>€&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Base Cost</mat-label>
      <input
        matInput
        type="number"
        formControlName="baseCost"
        placeholder="0.00"
      />
      <span matTextPrefix>€&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Additional Cost</mat-label>
      <input
        matInput
        type="number"
        formControlName="additionalCost"
        placeholder="0.00"
      />
      <span matTextPrefix>€&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="3"
        placeholder="Description of the financial transaction"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-3 pb-3">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    [disabled]="calcForm.invalid"
    (click)="submit()"
  >
    Calculate & Save
  </button>
</mat-dialog-actions>
