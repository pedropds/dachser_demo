<div class="container-fluid py-4">
  <div class="row mb-3 align-items-center top-bar">
    <div class="col-md-6">
      <h2 class="mat-h2 mb-0 fw-bold">Shipments Overview</h2>
    </div>

    <!-- Search Bar -->
    <div class="col-md-6 text-md-end">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Shipments</mat-label>
        <input
          matInput
          [formControl]="searchControl"
          (keyup.enter)="onSearch()"
          placeholder="e.g., 0001"
        />
        <button
          matSuffix
          mat-icon-button
          aria-label="Search"
          (click)="onSearch()"
        >
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <!-- Table Card -->
  <mat-card class="mat-elevation-z2 list-card border border-dark rounded-0">
    <table mat-table [dataSource]="dataSource" class="w-100 shipment-table">
      <!-- Tracking Number Column -->
      <ng-container matColumnDef="trackingNumber">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="fw-bold text-dark border-bottom border-dark"
        >
          Tracking No.
        </th>
        <td
          mat-cell
          *matCellDef="let shipment"
          class="border-bottom border-dark"
        >
          <strong>{{ shipment.trackingNumber }}</strong>
        </td>
      </ng-container>

      <!-- Customer Column -->
      <ng-container matColumnDef="customerId">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="fw-bold text-dark border-bottom border-dark"
        >
          Customer ID
        </th>
        <td
          mat-cell
          *matCellDef="let shipment"
          class="border-bottom border-dark"
        >
          {{ shipment.customerId }}
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="fw-bold text-dark border-bottom border-dark"
        >
          Status
        </th>
        <td
          mat-cell
          *matCellDef="let shipment"
          class="border-bottom border-dark"
        >
          <!-- Using a getter class method or inline mapping for status colors -->
          <span
            class="badge"
            [ngClass]="{
              'bg-success': shipment.status === 'DELIVERED',
              'bg-warning text-dark': shipment.status === 'IN_TRANSIT',
              'bg-secondary': shipment.status === 'CREATED',
            }"
          >
            {{ shipment.status | titlecase }}
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="fw-bold text-dark border-bottom border-dark text-end"
        >
          Actions
        </th>
        <td
          mat-cell
          *matCellDef="let shipment"
          class="border-bottom border-dark text-end"
        >
          <button
            mat-stroked-button
            color="primary"
            class="rounded-0"
            (click)="viewShipment(shipment.trackingNumber)"
          >
            View Details
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <!-- Add a hover class to rows to make them feel interactive -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="interactive-row"
      ></tr>
    </table>

    <!-- Pagination -->
    <mat-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)"
      aria-label="Select page"
      class="border-top border-dark"
    >
    </mat-paginator>
  </mat-card>
</div>
